<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>EMC Desk — Login</title>
  <link rel="stylesheet" href="assets/app.css" />
</head>
<body class="page page-login">
  <div class="login-shell">
    <header class="login-header">
      <div class="brand">
        <div class="brand-mark">EMC</div>
        <div class="brand-name">
          <h1>EMC Desk</h1>
          <p class="muted">Exploration dashboard</p>
        </div>
      </div>
      <button id="themeToggle" class="btn btn-ghost" type="button" aria-label="Toggle theme">
        <span class="icon">🌓</span>
        <span class="label">Theme</span>
      </button>
    </header>

    <main class="login-card">
      <h2>Sign in</h2>

      <form id="loginForm" class="form">
        <label class="field">
          <span>Email</span>
          <input id="username" name="username" autocomplete="email" placeholder="example@email.com" required />
        </label>

        <label class="field">
          <span>Password</span>
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required />
        </label>

        <label class="field checkbox">
          <input id="rememberMe" type="checkbox" checked />
          <span>Remember me</span>
        </label>

        <div class="row">
          <button class="btn btn-primary" type="submit">Login</button>
        </div>

        <div id="loginError" class="alert alert-danger hidden"></div>
      </form>
    </main>

    <footer class="login-footer muted"></footer>
  </div>

  <script src="assets/app.js"></script>
  <script src="assets/login.js"></script>
</body>
</html>
