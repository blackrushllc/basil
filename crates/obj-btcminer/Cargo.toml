[package]
name = "obj-btcminer"
version = "0.1.0"
edition = "2021"

[dependencies]
btcminer-core = { path = "../btcminer-core", features = ["db_sqlite"] }
basil-common = { workspace = true }
basil-bytecode = { workspace = true }
serde_json = "1.0"
chrono = "0.4"
once_cell = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync"] }

[lib]
name = "obj_btcminer"
path = "src/lib.rs"
