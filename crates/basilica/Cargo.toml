[package]
name = "basilica"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crossbeam-channel = "0.5"
parking_lot = "0.12"
directories = "5.0"
rfd = { version = "0.14", default-features = true }

# GUI
eframe = { version = "0.29", default-features = true, features = ["wgpu"] }
egui = "0.29"
wry = "0.44"
tao = "0.30"

# Windows (for COM initialization in webview thread)
windows = { workspace = true, features = ["Win32_System_Com"] }

# Internal crates
basil-embed = { path = "../basil-embed" }
basil-host = { path = "../basil-host" }



[features]
# Re-export embedder feature sets so Basilica can be run with the same flags as basilc
obj-bmx = ["basil-embed/obj-bmx"]
obj-bmx-rider = ["basil-embed/obj-bmx-rider"]
obj-bmx-team = ["basil-embed/obj-bmx-team"]
obj-base64 = ["basil-embed/obj-base64"]
obj-zip = ["basil-embed/obj-zip"]
obj-curl = ["basil-embed/obj-curl"]
obj-json = ["basil-embed/obj-json"]
obj-csv = ["basil-embed/obj-csv"]
obj-sqlite = ["basil-embed/obj-sqlite"]
# SQL connectors
obj-sql-mysql = ["basil-embed/obj-sql-mysql"]
obj-sql-postgres = ["basil-embed/obj-sql-postgres"]
obj-sql = ["basil-embed/obj-sql"]
# Audio/MIDI/DAW/AI/Terminal
obj-audio = ["basil-embed/obj-audio"]
obj-midi  = ["basil-embed/obj-midi"]
obj-daw   = ["basil-embed/obj-daw"]
obj-ai    = ["basil-embed/obj-ai"]
obj-term  = ["basil-embed/obj-term"]
# AWS
obj-aws-s3  = ["basil-embed/obj-aws-s3"]
obj-aws-ses = ["basil-embed/obj-aws-ses"]
obj-aws-sqs = ["basil-embed/obj-aws-sqs"]
obj-aws     = ["basil-embed/obj-aws"]
# NET
obj-net-sftp = ["basil-embed/obj-net-sftp"]
obj-net-smtp = ["basil-embed/obj-net-smtp"]
obj-net-http = ["basil-embed/obj-net-http"]
obj-net      = ["basil-embed/obj-net"]
# ORM
obj-orm = ["basil-embed/obj-orm"]
obj-orm-mysql = ["basil-embed/obj-orm-mysql"]
obj-orm-postgres = ["basil-embed/obj-orm-postgres"]
obj-orm-all = ["basil-embed/obj-orm-all"]
# Umbrellas
obj-all  = ["basil-embed/obj-all"]
obj-safe = ["basil-embed/obj-safe"]
# Compatibility / misc
obj-sQ = ["basil-embed/obj-sQ"]
portable = ["basil-embed/portable"]
