[package]
name = "btcminer-core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.31", optional = true, features = ["bundled"] }
thiserror = "1.0"
log = "0.4"

[features]
default = []
db_sqlite = ["rusqlite"]
